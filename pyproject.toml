[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
# Solo reglas de alta confianza: errores de sintaxis/indentación (E9) y pyflakes (F),
# que detectan nombres indefinidos e imports que no existen. Se deja fuera isort (I),
# pyupgrade (UP) y bugbear (B) a propósito: son opinionadas y el código existente no
# las cumple, así que incluirlas haría fallar el gate de CI sin señal útil.
select = ["E9", "F"]
ignore = [
    "E501",    # el ancho lo gestiona ruff format
    "E402",    # los imports de core.config tras `from core import state` son intencionados
]

[tool.ruff.lint.per-file-ignores]
"bot.py" = ["F401", "E402"]  # bot.py inyecta atributos en la instancia para los cogs
"cogs/*.py" = ["F401"]        # los cogs consumen self.bot.* inyectado en bot.py
"ui/embed.py" = ["A002"]     # `titulo`/`error` chocan con builtins/keywords a propósito
"tests/*" = ["F401"]
